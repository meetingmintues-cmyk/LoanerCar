<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loaner Car Tracker</title>
<style>
:root{
  --bg:#060a13; --surface:#0f1626; --surface-2:#141d31; --line:rgba(140,170,255,.12);
  --text:#eef2fb; --text-2:#a9b4cc; --muted:#6c7891;
  --accent:#22d3ee; --accent-2:#8b5cf6;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --radius:16px;
  --bg-glow1:#11204a; --bg-glow2:#2a1252;
  --topbar:rgba(6,10,19,.6); --soft:rgba(255,255,255,.03); --soft-2:rgba(255,255,255,.06);
  --card-a:rgba(20,29,49,.82); --card-b:rgba(12,18,32,.82); --portal-a:#101a31; --portal-b:#0a1020;
  --th-bg:#111a2d; --tip-bg:rgba(8,12,24,.96); --panel-solid:#0d1424; --scrim:rgba(3,6,14,.7);
  --gridline:rgba(160,180,230,.09); --mark-ring:#0f1626; --strong:#fff; --line-strong:rgba(34,211,238,.35);
  --hero:linear-gradient(90deg,#fff 0%,#9fd8ff 40%,#c4a8ff 100%);
  --good-t:#7ee07e; --crit-t:#ff8a8a; --warn-t:#fab219; --up:#4ade80; --down:#f87171;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#f6f8fc; --line:rgba(30,50,90,.12);
  --text:#0d1424; --text-2:#46526a; --muted:#6b778d;
  --accent:#0891b2; --accent-2:#7c3aed;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --bg-glow1:#dbe8ff; --bg-glow2:#efe3ff;
  --topbar:rgba(255,255,255,.75); --soft:rgba(13,20,36,.03); --soft-2:rgba(13,20,36,.07);
  --card-a:rgba(255,255,255,.92); --card-b:rgba(250,252,255,.92); --portal-a:#ffffff; --portal-b:#f2f6fd;
  --th-bg:#eef2f9; --tip-bg:rgba(255,255,255,.98); --panel-solid:#ffffff; --scrim:rgba(30,40,60,.35);
  --gridline:rgba(30,50,90,.09); --mark-ring:#ffffff; --strong:#0d1424; --line-strong:rgba(8,145,178,.35);
  --hero:linear-gradient(90deg,#0d1424 0%,#1d5fb8 45%,#6d3fd1 100%);
  --good-t:#006300; --crit-t:#b42323; --warn-t:#8a5a00; --up:#0a7d2c; --down:#c0262d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 15% -10%,var(--bg-glow1) 0%,transparent 60%),radial-gradient(900px 600px at 110% 10%,var(--bg-glow2) 0%,transparent 55%),var(--bg);
  color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;font-variant-numeric:tabular-nums}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;min-height:100%}
button{font:inherit;color:inherit}
.mono{font-family:"Cascadia Code","SF Mono",Consolas,monospace}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 24px;backdrop-filter:blur(14px);background:var(--topbar);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35;box-shadow:0 0 2px var(--accent)}}
.spacer{flex:1}
.sync{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.sync .led{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live .led{background:var(--good);box-shadow:0 0 8px var(--good)}
.sync.snap .led{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12px;letter-spacing:.06em;transition:.2s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.btn:focus-visible,.portal:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#backBtn{display:none}
body.in-report #backBtn{display:inline-flex}

/* views */
.view{display:none}
.view.active{display:block}

/* landing */
#landing{min-height:calc(100vh - 60px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
#landing.active{display:flex}
.kicker{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);opacity:.9}
.hero{font-size:clamp(28px,4.6vw,54px);font-weight:800;margin:10px 0 6px;letter-spacing:-.01em;
  background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text-2);max-width:620px;margin:0 auto 44px}
.portals{display:grid;grid-template-columns:repeat(2,minmax(280px,420px));gap:28px;perspective:1200px}
@media (max-width:720px){.portals{grid-template-columns:1fr}}
.portal{position:relative;text-align:left;cursor:pointer;border:none;padding:0;border-radius:22px;background:transparent;
  transform-style:preserve-3d;transition:transform .25s ease, opacity .45s ease, filter .45s ease;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.portal:nth-child(2){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}}
.portal .frame{position:relative;border-radius:22px;padding:2px;overflow:hidden;background:linear-gradient(135deg,rgba(34,211,238,.6),rgba(139,92,246,.15) 40%,rgba(139,92,246,.6))}
.portal .frame::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,var(--accent) 80%,transparent 90%);animation:spin 5s linear infinite;opacity:.7}
.portal:nth-child(2) .frame::before{background:conic-gradient(from 180deg,transparent 0 70%,var(--accent-2) 80%,transparent 90%);animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
.portal .inner{position:relative;border-radius:20px;background:linear-gradient(160deg,var(--portal-a) 0%,var(--portal-b) 100%);padding:28px 26px 22px;min-height:290px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.portal .inner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);pointer-events:none}
.portal .ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.35);box-shadow:inset 0 0 20px rgba(34,211,238,.15)}
.portal:nth-child(2) .ico{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.45);box-shadow:inset 0 0 20px rgba(139,92,246,.2)}
.portal h2{margin:0;font-size:24px;letter-spacing:.02em}
.portal p{margin:0;color:var(--text-2);font-size:13px}
.portal .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.portal .mini div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.portal .mini b{display:block;font-size:17px}
.portal .mini span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.portal .cta{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.portal:nth-child(2) .cta{color:#b9a2ff}
.portal .cta i{transition:transform .3s;font-style:normal}
.portal:hover .cta i{transform:translateX(6px)}
.portal:hover{filter:drop-shadow(0 18px 40px rgba(34,211,238,.18))}
.portals.launching .portal{opacity:0;transform:scale(.9);filter:blur(6px)}
.portals.launching .portal.chosen{opacity:1;transform:scale(1.08) translateZ(60px);filter:drop-shadow(0 0 60px rgba(34,211,238,.45))}
.foot{margin-top:40px;font-size:12px;color:var(--muted)}

/* report */
.report{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:18px}
.rhead h1{margin:0;font-size:28px;letter-spacing:.01em}
.rhead .tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.filters label{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-right:4px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text-2);transition:.2s}
.chip:hover{color:var(--text);border-color:rgba(34,211,238,.5)}
.chip.on{background:rgba(34,211,238,.14);border-color:var(--accent);color:var(--strong);box-shadow:0 0 14px rgba(34,211,238,.25)}
select,input[type=search],input[type=number]{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 12;background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;height:1px;width:100%;background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent)}
.card h3{margin:0 0 2px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.card .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
@media (max-width:1100px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.view.entering .reveal{animation:reveal .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(4px)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 70%)}
.kpi .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--text-2);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ax text{fill:var(--muted);font-size:11px}
.ax line{stroke:var(--gridline)}
.lbl{fill:var(--text-2);font-size:11px}
.lbl-strong{fill:var(--text);font-size:11.5px;font-weight:600}
.grow{transform-box:fill-box;transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both}
.growx{transform-box:fill-box;transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hit{fill:transparent;cursor:crosshair}
.col .xh{opacity:0;transition:opacity .15s}
.col:hover .xh{opacity:1}
[data-tip]:hover{filter:brightness(1.25)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tip-bg);color:var(--text);border:1px solid rgba(34,211,238,.4);border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:300px}
#tip.on{opacity:1}
#tip b{color:var(--strong)}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--text-2)}
#tip .r span:last-child{color:var(--text)}

/* tables */
.tablewrap{overflow:auto;max-height:520px;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(140,170,255,.07);white-space:nowrap}
th{position:sticky;top:0;background:var(--th-bg);color:var(--text-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
td.n,th.n{text-align:right}
tbody tr:hover{background:rgba(34,211,238,.05)}
.bar-cell{position:relative}
.bar-cell .b{position:absolute;left:0;top:50%;height:4px;border-radius:2px;background:var(--s1);opacity:.55;transform:translateY(8px)}

/* pills & insights */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid}
.pill.good{color:var(--good-t);border-color:rgba(12,163,12,.6);background:rgba(12,163,12,.12)}
.pill.warn{color:var(--warn-t);border-color:rgba(250,178,25,.55);background:rgba(250,178,25,.1)}
.pill.crit{color:var(--crit-t);border-color:rgba(208,59,59,.7);background:rgba(208,59,59,.15)}
.pill.none{color:var(--muted);border-color:var(--line)}
.insights{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--text-2)}
.insights li b{color:var(--text)}
.insights li .ic{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(34,211,238,.12);color:var(--accent);font-size:12px}
.insights li.w .ic{background:rgba(250,178,25,.15);color:var(--warn-t)}
.insights li.c .ic{background:rgba(208,59,59,.15);color:var(--crit-t)}

/* fleet */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.car{border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--soft);position:relative;overflow:hidden;transition:.25s}
.car:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.4)}
.car.out{border-color:rgba(250,178,25,.45);box-shadow:inset 0 0 24px rgba(250,178,25,.08)}
.car.over{border-color:rgba(208,59,59,.65);box-shadow:inset 0 0 26px rgba(208,59,59,.14);animation:alarm 2s infinite}
@keyframes alarm{50%{box-shadow:inset 0 0 6px rgba(208,59,59,.05)}}
.car.ghost{opacity:.55;border-style:dashed}
.car .reg{font-family:"Cascadia Code","SF Mono",Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.06em}
.car .model{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.car .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.car .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.car .stats div{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.car .stats b{display:block;font-size:14px;color:var(--text);letter-spacing:0}
.car .meter{height:4px;border-radius:2px;background:var(--soft-2);margin-top:10px;overflow:hidden}
.car .meter span{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--accent));border-radius:2px}
.car .foot2{font-size:11px;color:var(--text-2);margin-top:8px;min-height:16px}
.flag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;margin:1px 3px 1px 0;background:rgba(250,178,25,.12);color:var(--warn-t);border:1px solid rgba(250,178,25,.35)}
.empty{color:var(--muted);font-size:13px;padding:30px;text-align:center}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
body.noanim .grow,body.noanim .growx,body.noanim .draw,body.noanim .reveal,body.noanim .chart *{animation:none!important;stroke-dashoffset:0!important}
/* car modal */
#carModal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
#carModal.on{display:flex}
#carModal .mback{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);animation:fadeIn .25s both}
#carModal .mpanel{position:relative;width:min(1240px,100%);background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:20px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
#carModal .mclose{position:absolute;right:18px;top:18px}
.mhead{display:flex;align-items:flex-start;gap:20px;margin-bottom:14px;padding-right:110px}
.mhead .tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.reg.big{font-family:"Cascadia Code","SF Mono",Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.06em}
.mhead .model{font-size:12px;color:var(--muted);letter-spacing:.14em}
.callout{border:1px solid rgba(250,178,25,.45);background:rgba(250,178,25,.08);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.callout.crit{border-color:rgba(208,59,59,.6);background:rgba(208,59,59,.1)}
.mini6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mini6 .v{font-size:22px}
.car[data-car]{cursor:pointer}
.car .more{font-size:11px;color:var(--accent);opacity:0;transition:.2s}
.car:hover .more,.car:focus-visible .more{opacity:1}
.car:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tfoot td{position:sticky;bottom:0;background:var(--th-bg)}
html.theming *{transition:background-color .5s,color .5s,border-color .5s,fill .5s!important}
:root[data-theme="light"] #bg{opacity:.35}
:root[data-theme="light"] .portal:nth-child(2) .cta{color:var(--accent-2)}
:root[data-theme="light"] .portal .ico svg{filter:brightness(.75)}
:root[data-theme="light"] .portal .inner::after{display:none}
:root[data-theme="light"] .card,:root[data-theme="light"] .kpi{box-shadow:0 1px 2px rgba(13,20,36,.05),0 8px 24px rgba(13,20,36,.05)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* tracker nav */
.tabs{position:sticky;top:var(--tb,57px);z-index:19;display:flex;gap:4px;padding:0 24px;backdrop-filter:blur(14px);background:var(--topbar);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{position:relative;padding:13px 16px;color:var(--text-2);text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:color .2s}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--text);font-weight:600}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;box-shadow:0 0 12px var(--accent);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:10px;background:rgba(250,178,25,.18);color:var(--warn-t);text-align:center;margin-left:4px}
.badge:empty{display:none}
#page.entering .reveal{animation:reveal .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.report{padding-top:18px}
.rhead .sub2{color:var(--text-2);font-size:13px;margin-top:4px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.crumb a,.lnk{color:var(--accent);text-decoration:none}
.crumb a:hover,.lnk:hover{text-decoration:underline}
.crumb .sp{flex:1}
tr.clickrow{cursor:pointer}
.reg.big{font-family:"Cascadia Code","SF Mono",Consolas,monospace;font-size:30px;font-weight:800;letter-spacing:.06em}
.callout{border:1px solid rgba(250,178,25,.45);background:rgba(250,178,25,.08);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.car[data-car]{cursor:pointer}
.car .more{font-size:11px;color:var(--accent);opacity:0;transition:.2s}
.car:hover .more{opacity:1}
.car.long{border-color:rgba(236,131,90,.7);box-shadow:inset 0 0 24px rgba(236,131,90,.12)}

.warnt{color:#ff9b6b}

/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 40%,#0f2150,#04070f 70%);transition:clip-path 1s cubic-bezier(.7,0,.2,1),opacity .6s .6s;clip-path:circle(150% at 50% 50%)}

.intro-box{width:min(560px,86vw);text-align:center}
.intro-title{font-size:clamp(22px,4vw,36px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:22px}
.intro-sub{color:var(--text-2);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}

.intro-road::before{content:"";position:absolute;left:0;right:0;bottom:16px;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 40px,transparent 40px 80px);animation:lanes .5s linear infinite;opacity:.7;box-shadow:0 0 12px var(--accent)}
.intro-road .carsvg{position:absolute;left:50%;bottom:16px;width:190px;transform:translateX(-50%);animation:bob .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px rgba(34,211,238,.6))}
#intro.done .intro-road .carsvg{animation:zoomoff .8s cubic-bezier(.6,0,.4,1) forwards}
.speed{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent));opacity:.55;animation:speed .7s linear infinite}
.intro-bar{height:3px;border-radius:3px;background:var(--soft-2);margin-top:18px;overflow:hidden}
.intro-bar span{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),var(--accent-2));animation:loadbar 1.2s ease-in-out infinite}

@keyframes speed{from{transform:translateX(120%)}to{transform:translateX(-160%)}}
@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

#warp.go{animation:warpfade .8s ease both}
#warp.go::before{animation:warpline .8s cubic-bezier(.6,0,.2,1) both}
#warp.go .carsvg{animation:warpcar .8s cubic-bezier(.6,0,.3,1) both}

#warp.go.rev .carsvg{animation-name:warpcarrev}
@keyframes warpfade{0%,100%{opacity:0}10%,80%{opacity:1}}

@keyframes warpcar{from{left:-80px}to{left:calc(100% + 10px)}}

@keyframes wheel{to{transform:rotate(360deg)}}
@keyframes beam{from{opacity:.08}to{opacity:.28}}

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;

    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f="";}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}

}

    if(!t.rawJ) t.issues.push("No JC date");
    else if(!t.start) t.issues.push(`JC date "${t.rawJ}" unreadable`);
    if(t.rawR && !t.recv) t.issues.push(`In take date "${t.rawR}" unreadable`);
    if(!t.out && !t.recv) t.issues.push("Status IN but no in take date");
    if(t.out && t.recv) t.issues.push("Status OUT but has an in take date");
    if(t.start && t.recv && !t.out){
      const d=Math.round((t.recv-t.start)/DAY);
      if(d<0){ t.issues.push(`In take date ${fmtD(t.recv)} is before JC date ${fmtD(t.start)}; TAT not counted`); t.tatBad=true; }
      else if(d>CONFIG.MAX_TAT){ t.issues.push(`TAT of ${d} days (${fmtD(t.start)} to ${fmtD(t.recv)}) looks like a date typo; not counted`); t.tatBad=true; }
      else t.tat=d;
    }
    // labour: an amount = paid work; "Nil" = no labour earned (non-revenue use); blank on an OUT loan = not billed yet
    t.nil = /^(NIL+|NILL|0+|-|NA|N\/A|NONE)$/i.test(t.labRaw.replace(/\s/g,"")) || (t.labour===0);
    if(t.nil) t.labour=0;
    t.labState = t.labour>0 ? "paid" : t.nil ? "nil" : t.out ? "pending" : "missing";
    if(t.labState==="missing") t.issues.push("Returned but LABOUR OF WORK is blank (enter an amount or Nil)");
    if(t.type==="Not entered" && !t.out) t.issues.push("TYPE is blank");
    if(t.type==="Bodyshop" && t.nil && !t.out) t.issues.push("TYPE is body shop but labour is Nil");
    if(t.type!=="Bodyshop" && t.type!=="Not entered" && t.labour>0) t.issues.push(`TYPE is ${t.type} but labour ${inr(t.labour)} is entered`);
    if(t.out && t.start && t.start>today) t.issues.push(`JC date ${fmtD(t.start)} is in the future`);
    if(t.gOdo!=null && t.rOdo!=null){ t.km=t.rOdo-t.gOdo;
      if(t.km<0){ t.issues.push(`In km ${int(t.rOdo)} is lower than out km ${int(t.gOdo)}`); t.km=null; }
      else if(t.km===0) t.issues.push("Zero km used (in km = out km)");
      else if(t.km>CONFIG.HIGH_KM) t.issues.push(`High km for one loan (${int(t.km)} km)`);
    } else t.km=null;
    if(!t.out && t.gOdo!=null && t.rOdo==null) t.issues.push("Status IN but no in km");
    t.end = t.out ? today : (t.tat!=null ? t.recv : t.start);
    trips.push(t);
  });
  const cars={};
  trips.forEach(t=>{ (cars[t.car]=cars[t.car]||{reg:t.car,trips:[]}).trips.push(t); });
  Object.values(cars).forEach(c=>{
    const cnt={}; c.trips.forEach(t=>{ if(t.modelRaw) cnt[t.modelRaw]=(cnt[t.modelRaw]||0)+1; });
    c.model=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||"–";
    c.trips.sort((a,b)=>(a.gOdo??0)-(b.gOdo??0) || (+a.si)-(+b.si));
    c.trips.forEach((t,i)=>{ t.model=c.model;
      if(t.modelRaw && t.modelRaw!==c.model) t.issues.push(`Model "${t.modelRaw}" differs from usual ${c.model}`);
      const p=c.trips[i-1]; if(p && p.rOdo!=null && t.gOdo!=null && t.gOdo-p.rOdo>50) t.gap=t.gOdo-p.rOdo;
      if(p && p.rOdo!=null && t.gOdo!=null && t.gOdo<p.rOdo-5) t.issues.push(`Out km ${int(t.gOdo)} is lower than this car's previous in km ${int(p.rOdo)}`);
    });
    c.trips.sort((a,b)=>(a.start||0)-(b.start||0) || (+a.si)-(+b.si));
    c.last=c.trips[c.trips.length-1]; c.current=c.trips.filter(t=>t.out).pop()||null;
  });
  CONFIG.FLEET_REGS.map(normReg).forEach(r=>{ if(r && !cars[r]) cars[r]={reg:r,trips:[],model:"–",last:null,current:null}; });
  const regs=Object.keys(cars), similar=[];
  for(let i=0;i<regs.length;i++) for(let j=i+1;j<regs.length;j++){ const a=regs[i],b=regs[j]; if(a.length===b.length){ let d=0; for(let k=0;k<a.length;k++) if(a[k]!==b[k]) d++; if(d===1) similar.push([a,b]); } }
  const months=[...new Set(trips.filter(t=>t.start).map(t=>mkey(t.start)))].sort();
  const types=[...new Set(trips.map(t=>t.type))].sort((a,b)=>(TYPE_ORDER.indexOf(a)+1||9)-(TYPE_ORDER.indexOf(b)+1||9)||a.localeCompare(b));
  return {trips,cars,similar,months,types};
}

    n:list.length,out:list.filter(t=>t.out).length,km:sumBy(km,t=>t.km),kmN:km.length,tat:tats.length?tats.reduce((a,b)=>a+b,0)/tats.length:null,tatMed:tats.length?median(tats):null,

function donut(el, parts, center){

function stackBars(el, cats, series, opt={}){
  const W=Math.max(el.clientWidth,280), H=opt.h||240, m={l:opt.ml||52,r:10,t:14,b:30}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  if(!cats.length){el.innerHTML='<div class="empty">No data</div>';return;}
  const tots=cats.map((_,i)=>series.reduce((s,x)=>s+(x.values[i]||0),0)), max=niceMax(Math.max(1,...tots)), fmt=opt.fmt||int;
  const band=iw/cats.length, bw=Math.min(34,band*0.6);
  let g=`<g class="ax">`; for(let i=0;i<=4;i++){const v=max*i/4,y=m.t+ih-ih*i/4; g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-8}" y="${y+4}" text-anchor="end">${tick(v,max)}</text>`;} g+=`</g>`;
  let b=""; cats.forEach((c,ci)=>{ let y0=m.t+ih; const x=m.l+band*ci+(band-bw)/2; const segs=series.map(s=>({s,v:s.values[ci]||0})).filter(o=>o.v>0);
    segs.forEach((o,k)=>{ const h=ih*o.v/max, top=k===segs.length-1; const y=y0-h; const hh=Math.max(0,h-(k?2:0));
      b+= top?`<path class="grow" style="animation-delay:${ci*60}ms" d="${barPath(x,y,bw,hh,4)}" fill="${o.s.color}"/>`:`<rect class="grow" style="animation-delay:${ci*60}ms" x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${o.s.color}"/>`; y0=y; });
    if(tots[ci]) b+=`<text class="lbl-strong" x="${x+bw/2}" y="${y0-6}" text-anchor="middle" font-size="10.5">${opt.short?opt.short(tots[ci]):shortN(tots[ci])}</text>`;
    b+=`<rect class="hit" x="${m.l+band*ci}" y="${m.t}" width="${band}" height="${ih}" data-i="${ci}" data-tip="${esc(opt.tip?opt.tip(ci):tipRows(c,series.map(s=>[s.name,fmt(s.values[ci]||0)])))}"/>`;
    b+=`<text class="lbl" x="${m.l+band*ci+band/2}" y="${H-10}" text-anchor="middle">${esc(opt.catFmt?opt.catFmt(c):c)}</text>`; });
  el.innerHTML=`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opt.aria||'stacked bars')}">${g}${b}</svg>`;
  if(opt.onClick) el.querySelectorAll(".hit").forEach(h=>{ h.style.cursor="pointer"; h.addEventListener("click",()=>opt.onClick(+h.dataset.i)); });
}

function insights(el,S,cars,outs){
  const ins=[], A=agg(S);
  outs.filter(t=>daysOut(t)>=CONFIG.LONG_OUT_DAYS).forEach(t=>ins.push({c:"w",ic:"⟶",t:`<b>${prettyReg(t.car)}</b> has been with ${esc(t.cname)} (${esc(t.creg)}) for <b>${daysOut(t)} days</b> since ${fmtD(t.start)}.`}));
  if(A.nilN) ins.push({c:"w",ic:"₹0",t:`<b>${plural(A.nilN,"loan")}</b> earned no labour (Nil) but used <b>${int(A.nilKm)} km</b> and ${plural(A.nilDays,"day")} of car time. That's ${pct(A.nilKm/Math.max(1,A.km))} of all used km.`});
  if(A.labour) ins.push({ic:"₹",t:`Labour earned: <b>${inr(A.labour)}</b> from ${plural(A.paidN,"loan")}, about <b>${inr(A.labour/A.paidN)}</b> per loan and <b>${A.paidKm?inr(A.labour/A.paidKm):"–"}</b> per km driven.`});
  const by=cars.map(c=>({c,A:agg(c.trips.filter(t=>S.includes(t)))})).filter(x=>x.A.n);
  const earn=by.slice().sort((a,b)=>b.A.labour-a.A.labour)[0]; if(earn&&earn.A.labour) ins.push({ic:"★",t:`Top earning car: <b>${prettyReg(earn.c.reg)}</b> (${earn.c.model}) with ${inr(earn.A.labour)} from ${plural(earn.A.paidN,"loan")}.`});
  const nilCar=by.slice().sort((a,b)=>b.A.nilKm-a.A.nilKm)[0]; if(nilCar&&nilCar.A.nilKm) ins.push({c:"w",ic:"⟿",t:`Most Nil-labour km: <b>${prettyReg(nilCar.c.reg)}</b>, ${int(nilCar.A.nilKm)} km over ${plural(nilCar.A.nilN,"loan")}.`});
  const idle=cars.filter(c=>!c.current&&(!c.last||!c.last.recv||(today-c.last.recv)/DAY>30)).length+Math.max(0,CONFIG.FLEET_SIZE-cars.length);
  if(idle) ins.push({c:"w",ic:"◌",t:`<b>${idle} of ${CONFIG.FLEET_SIZE}</b> cars have had no loan in the last 30 days.`});
  if(A.retN){ const long=S.filter(t=>t.tat!=null&&t.tat>=7); ins.push({ic:"⏱",t:`Average TAT is <b>${A.tat.toFixed(1)} days</b> (median ${A.tatMed}). ${long.length?`${plural(long.length,"loan")} ran a week or longer.`:"No loan ran a week or longer."}`}); }
  const gaps=S.filter(t=>t.gap); if(gaps.length) ins.push({c:"w",ic:"?",t:`<b>${int(sumBy(gaps,t=>t.gap))} km</b> are unaccounted for between loans (${plural(gaps.length,"gap")}): the out km was higher than the car's previous in km.`});
  el.innerHTML=ins.length?ins.map(i=>`<li class="${i.c||""}"><span class="ic">${i.ic}</span><span>${i.t}</span></li>`).join(""):'<li>No loans in this period.</li>';
}

function parseRoute(){ const raw=location.hash.replace(/^#\/?/,""); const [path,qs]=raw.split("?"); const h=path.split("/"); return {page:PAGES[h[0]]?h[0]:"overview",arg:h[1]?decodeURIComponent(h[1]):null,qs:qs||""}; }
function renderFilters(){
  const p=route.page, showM=["overview","vehicles","types","log"].includes(p), showT=!["types","checks"].includes(p);
  const f=$("#filters"); f.style.display=showM||showT?"":"none";
  f.innerHTML=(showM?`<div class="fgroup"><label>Month</label>`+["ALL",...LC.months].map(m=>`<button class="chip ${st.month===m?'on':''}" data-m="${m}">${m==="ALL"?"All time":monLabel(m)}</button>`).join("")+`</div>`:"")+
    (showT?`<div class="fgroup"><label>Type</label>`+["ALL",...LC.types].map(t=>`<button class="chip ${st.type===t?'on':''}" data-t="${esc(t)}">${t==="ALL"?"All":esc(t)}</button>`).join("")+`</div>`:"");
  f.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{st.month=b.dataset.m;go("filter");});

function go(mode=true){
  route=parseRoute(); if(!LC) return;
  if(route.qs==="out"){ st.status="OUT"; st.lab="ALL"; } else if(route.qs==="nil"){ st.lab="nil"; st.status="ALL"; }
  const animate=mode===true, pg=$("#page");
  NOANIM=!animate&&mode!=="filter"; document.body.classList.toggle("noanim",NOANIM);
  const tab=TABOF[route.page]||route.page; document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.page===tab)); moveInk();
  const dir=lastPage==null?0:Math.sign(ORDER.indexOf(route.page)-ORDER.indexOf(lastPage)) || 1; lastPage=route.page;
  const paint=()=>{ renderFilters(); pg.classList.remove("entering","from-left","from-right"); PAGES[route.page]();
    if(animate||mode==="filter"){ void pg.offsetWidth; pg.classList.add("entering", dir<0?"from-left":"from-right"); } };
  if(animate && document.body.classList.contains("ready")){ warp(dir); pg.classList.add("leaving"); setTimeout(()=>{ pg.classList.remove("leaving"); paint(); window.scrollTo({top:0,behavior:"instant"}); },260); }
  else paint();
}
function warp(dir){ const w=$("#warp"); w.classList.remove("go","rev"); void w.offsetWidth; w.classList.add("go"); if(dir<0) w.classList.add("rev"); }
async function loadAll(first){
  $("#syncText").textContent="Syncing…"; $("#sync").className="sync";
  const t0=performance.now(); const r=await fetchCSV(CONFIG.LOANER_CSV,SNAP_LC);
  try{ LC=loadLoaner(r.text); if(!LC.trips.length) throw new Error("no rows"); }catch(e){ console.error(e); LC=loadLoaner(SNAP_LC); r.live=false; }
  $("#sync").className="sync "+(r.live?"live":"snap");
  $("#syncText").textContent=r.live?`Live · synced ${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`:"Offline snapshot (21 Nov 26) · sheet unreachable";
  const n=LC.trips.filter(t=>t.issues.length).length+LC.similar.length; $("#chkN").textContent=n||"";
  if(st.month!=="ALL"&&!LC.months.includes(st.month)) st.month="ALL";
  if(st.type!=="ALL"&&!LC.types.includes(st.type)) st.type="ALL";
  if(first){ const wait=Math.max(0,1700-(performance.now()-t0)); $("#introStat").textContent=`${LC.trips.length} loans · ${Object.keys(LC.cars).length} cars · ${r.live?"live":"snapshot"}`;
    setTimeout(()=>{ document.body.classList.add("ready"); $("#intro").classList.add("done"); go(true); setTimeout(()=>$("#intro").remove(),1200); },wait); }
  else go(false);
}
window.addEventListener("hashchange",()=>go(true));
function setTb(){ document.documentElement.style.setProperty("--tb",$(".topbar").offsetHeight+"px"); } setTb(); addEventListener("resize",setTb);
$("#refreshBtn").onclick=()=>{ $("#refreshBtn").classList.add("spinning"); loadAll(false).then(()=>setTimeout(()=>$("#refreshBtn").classList.remove("spinning"),600)); };
function setThemeLabel(){ $("#themeBtn").textContent=isLight()?"☾ Dark":"☀ Light"; }
$("#themeBtn").onclick=()=>{ const t=isLight()?"dark":"light"; document.documentElement.classList.add("theming"); document.documentElement.dataset.theme=t; try{localStorage.setItem("scc-theme",t);}catch(e){} setThemeLabel(); go(false); setTimeout(()=>document.documentElement.classList.remove("theming"),600); };
setThemeLabel();
document.addEventListener("click",e=>{ const k=e.target.closest("[data-go]"); if(k) location.hash=k.dataset.go; });
// spotlight + tilt
document.addEventListener("pointermove",e=>{ const c=e.target.closest&&e.target.closest(".card,.kpi,.car"); if(!c) return; const r=c.getBoundingClientRect(); c.style.setProperty("--mx",(e.clientX-r.left)+"px"); c.style.setProperty("--my",(e.clientY-r.top)+"px");
  if(c.classList.contains("car")&&matchMedia("(hover:hover)").matches){ const rx=((e.clientY-r.top)/r.height-.5)*-8, ry=((e.clientX-r.left)/r.width-.5)*10; c.style.transform=`perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-3px)`; } });
document.addEventListener("pointerout",e=>{ const c=e.target.closest&&e.target.closest(".car"); if(c&&!c.contains(e.relatedTarget)) c.style.transform=""; });
let rz, lastW=innerWidth; window.addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{ if(Math.abs(innerWidth-lastW)>40){ lastW=innerWidth; go(false);} moveInk(); },200);});
setInterval(()=>loadAll(false), CONFIG.REFRESH_MIN*60*1000);
/* ================== BACKGROUND ================== */
(function(){
  const c=$("#bg"), x=c.getContext("2d"); let W,H,P=[];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
    P=Array.from({length:Math.round(innerWidth*innerHeight/22000)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25*devicePixelRatio,vy:(Math.random()-.5)*.25*devicePixelRatio})); }
  size(); addEventListener("resize",size);
  let t=0;
  function frame(){ t+=1; x.clearRect(0,0,W,H);
    // perspective grid
    const lt=document.documentElement.dataset.theme==="light"; x.strokeStyle=lt?"rgba(8,100,160,0.07)":"rgba(34,211,238,0.05)"; x.lineWidth=1; const hz=H*0.62;
    for(let i=-20;i<=20;i++){ x.beginPath(); x.moveTo(W/2+i*W*0.02,hz); x.lineTo(W/2+i*W*0.2,H); x.stroke(); }
    for(let j=0;j<14;j++){ const p=((j+(t*0.004)%1)/14); const y=hz+(H-hz)*p*p; x.globalAlpha=p; x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke(); } x.globalAlpha=1;
    const D=130*devicePixelRatio;
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1; }
    for(let i=0;i<P.length;i++){ const a=P[i]; x.fillStyle=lt?"rgba(40,90,170,.45)":"rgba(140,200,255,.5)"; x.fillRect(a.x,a.y,1.6*devicePixelRatio,1.6*devicePixelRatio);
      for(let j=i+1;j<P.length;j++){ const b=P[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy; if(d<D*D){ x.strokeStyle=`rgba(${lt?"40,90,170":"120,160,255"},${.12*(1-Math.sqrt(d)/D)})`; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } } }
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
const ss=document.createElement("style"); ss.textContent="@keyframes fadeIn{from{opacity:0}}"; document.head.appendChild(ss);

/* boot */
loadAll(true);
</script>
